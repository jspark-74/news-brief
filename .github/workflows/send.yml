name: 텔레그램 발송
on:
  workflow_dispatch:
    inputs:
      text:
        description: "보낼 내용"
        required: true
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: 발송
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID || '7332065233' }}
          TEXT: ${{ inputs.text }}
        run: |
          res=$(curl -s -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            -d chat_id="${CHAT}" --data-urlencode text="${TEXT}")
          echo "$res" | grep -q '"ok":true' && echo "발송 완료" || { echo "발송 실패: $res"; exit 1; }
